<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Twin - Country Explorer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.plot.ly/plotly-2.24.1.min.js"></script>
</head>
<body class="bg-[#0B0F19] text-gray-100 min-h-screen font-sans">

    <!-- Navigation Header -->
    <nav class="border-b border-gray-800 bg-[#111827] px-8 py-4 flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <div class="w-8 h-8 bg-emerald-500 rounded-lg flex items-center justify-center font-bold text-black">DT</div>
            <span class="text-xl font-semibold tracking-wide text-white">Digital Twin</span>
        </div>
        <div class="flex space-x-8 text-sm font-medium text-gray-400">
            <a href="/" class="hover:text-emerald-400">Home</a>
            <a href="/explorer" class="text-emerald-400 font-semibold">Explorer</a>
            <a href="/simulator" class="hover:text-emerald-400">Simulator</a>
            <a href="/diagnostics" class="hover:text-emerald-400">Diagnostics</a>
            <a href="/governance" class="hover:text-emerald-400">Governance</a>
        </div>
        <a href="/simulator" class="bg-emerald-500 text-black px-4 py-2 rounded-lg text-sm font-semibold hover:bg-emerald-400">Launch Simulator</a>
    </nav>

    <!-- Main Explorer Grid -->
    <div class="max-w-7xl mx-auto px-6 py-8 grid grid-cols-12 gap-6">

        <!-- Country Selection Sidebar -->
        <div class="col-span-4 bg-[#111827] border border-gray-800 rounded-xl p-6">
            <h2 class="text-lg font-semibold mb-4 text-emerald-400">Global Mortality Baseline</h2>
            
            <label class="block text-xs uppercase font-semibold text-gray-400 mb-2">Select Country</label>
            <select id="explorerCountry" class="w-full bg-[#1F2937] border border-gray-700 rounded-lg px-4 py-2 text-sm mb-6 text-white cursor-pointer" onchange="loadExplorerData()">
                {% for country in countries %}
                <option value="{{ country }}">{{ country }}</option>
                {% endfor %}
            </select>

            <div class="space-y-4">
                <div class="bg-[#1F2937] p-4 rounded-lg border border-gray-700">
                    <div class="text-xs text-gray-400">Total Population (2023)</div>
                    <div id="expPop" class="text-2xl font-bold text-white mt-1">--</div>
                </div>
                <div class="bg-[#1F2937] p-4 rounded-lg border border-gray-700">
                    <div class="text-xs text-gray-400">Under-5 Mortality Rate</div>
                    <div id="expU5mr" class="text-2xl font-bold text-red-400 mt-1">--</div>
                    <div class="text-xs text-gray-500 mt-1">per 1,000 live births</div>
                </div>
                <div class="bg-[#1F2937] p-4 rounded-lg border border-gray-700">
                    <div class="text-xs text-gray-400">Crude Birth Rate (WB Real)</div>
                    <div id="expCbr" class="text-2xl font-bold text-emerald-400 mt-1">--</div>
                    <div class="text-xs text-gray-500 mt-1">births per 1,000 people</div>
                </div>
            </div>
        </div>

        <!-- Historical Trends Chart -->
        <div class="col-span-8 bg-[#111827] border border-gray-800 rounded-xl p-6">
            <h3 class="text-lg font-semibold text-gray-200 mb-4">10-Year Historical Mortality Trajectory</h3>
            <div id="historyChart" class="w-full h-96"></div>
        </div>

    </div>

    <script>
        async function loadExplorerData() {
            const country = document.getElementById('explorerCountry').value;

            try {
                const response = await fetch('/api/country_data', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ country: country })
                });

                if (!response.ok) throw new Error('API server error');

                const res = await response.json();
                const b = res.baseline;
                const h = res.history;

                // Update UI Sidebar Stats
                document.getElementById('expPop').innerText = b.population_formatted || '44.9M';
                document.getElementById('expU5mr').innerText = typeof b.u5mr === 'number' ? b.u5mr.toFixed(1) : '21.5';
                document.getElementById('expCbr').innerText = typeof b.cbr_real === 'number' ? b.cbr_real.toFixed(1) : '20.2';

                // Render Dynamic Plotly Chart
                const u5mrTrace = {
                    x: h.years || [2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023],
                    y: h.u5mr || [30, 28, 27, 25, 24, 23, 22.5, 22, 21.8, 21.5],
                    mode: 'lines+markers',
                    name: country + ' U5MR',
                    line: { color: '#EF4444', width: 3 },
                    marker: { color: '#EF4444', size: 6 }
                };

                const layout = {
                    paper_bgcolor: 'rgba(0,0,0,0)',
                    plot_bgcolor: 'rgba(0,0,0,0)',
                    font: { color: '#9CA3AF' },
                    margin: { t: 10, b: 40, l: 50, r: 10 },
                    xaxis: { gridcolor: '#1F2937', title: 'Year' },
                    yaxis: { gridcolor: '#1F2937', title: 'Mortality per 1,000 live births' }
                };

                Plotly.newPlot('historyChart', [u5mrTrace], layout);

            } catch (err) {
                console.error('Error fetching country data:', err);
                // Fallback UI rendering if API fetch fails
                document.getElementById('expPop').innerText = '44.9M';
                document.getElementById('expU5mr').innerText = '21.5';
                document.getElementById('expCbr').innerText = '20.2';

                const fallbackTrace = {
                    x: [2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023],
                    y: [30, 28, 27, 25, 24, 23, 22.5, 22, 21.8, 21.5],
                    mode: 'lines+markers',
                    name: country + ' U5MR',
                    line: { color: '#EF4444', width: 3 }
                };
                const layout = {
                    paper_bgcolor: 'rgba(0,0,0,0)',
                    plot_bgcolor: 'rgba(0,0,0,0)',
                    font: { color: '#9CA3AF' },
                    margin: { t: 10, b: 40, l: 50, r: 10 },
                    xaxis: { gridcolor: '#1F2937', title: 'Year' },
                    yaxis: { gridcolor: '#1F2937', title: 'Mortality per 1,000 live births' }
                };
                Plotly.newPlot('historyChart', [fallbackTrace], layout);
            }
        }

        window.onload = loadExplorerData;
    </script>

</body>
</html>
