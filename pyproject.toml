[project]
name = "cause-twin"
version = "2.0.0"
description = "Econometric Digital Twin for Child Welfare Policy"
requires-python = ">=3.9"
dependencies = [
    "flask",
    "pandas",
    "numpy"
]

[project.optional-dependencies]
research = [
    "scikit-learn==1.5.2",
    "dowhy==0.11.1",
    "econml==0.15.1",
    "shap==0.43.0",
    "matplotlib==3.9.2",
    "seaborn==0.13.2",
    "linearmodels==6.1",
    "plotly==5.24.1",
    "requests==2.32.3"
]

[tool.vercel]
entrypoint = "webapp.api.index:app"
